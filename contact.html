<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의 | K-시니어 미디어 모델 아카데미</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="content.js?v=20261017-1"></script><style>
    :root{
      --ink:#1f2430;
      --navy:#273a52;
      --blue:#47637f;
      --active:#557A9E;
      --sage:#8b9b8e;
      --ivory:#f5f1e8;
      --warm:#ded5c4;
      --white:#ffffff;
      --muted:#68707a;
      --line:#d7d2c8;
      --shadow:0 18px 50px rgba(31,36,48,.08);
      --radius:24px;
      --max:1180px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:"Noto Sans KR",sans-serif;
      color:var(--ink);
      background:#fff;
      line-height:1.7;
      word-break:keep-all;
    }

    button,input,textarea,select{font:inherit}

    a{
      color:inherit;
      text-decoration:none;
    }

    .wrap{
      width:min(var(--max),calc(100% - 40px));
      margin:0 auto;
    }

    /* =====================
       ARS
    ===================== */

    .ars-bar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:100;
      background:var(--navy);
      color:#fff;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:9px 22px;
      text-align:center;
      font-size:16px;
      font-weight:800;
      box-shadow:0 4px 14px rgba(31,36,48,.12);
    }

    .ars-bar strong{margin-right:8px}
    .ars-bar span{color:#eef2f5}

    /* =====================
       HEADER
    ===================== */

    .topbar{
      position:sticky;
      top:48px;
      z-index:50;
      backdrop-filter:blur(16px);
      background:rgba(255,255,255,.94);
      border-bottom:1px solid rgba(31,36,48,.08);
    }

    .nav{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      min-width:0;
    }

    .brand-logo{
      display:none;
      width:auto;
      max-width:260px;
      height:52px;
      object-fit:contain;
      object-position:left center;
    }

    .brand.has-logo .brand-logo{display:block}
    .brand.has-logo .brand-fallback{display:none}

    .brand-fallback{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-mark{
      width:40px;
      height:40px;
      border-radius:50%;
      background:linear-gradient(145deg,var(--navy),var(--sage));
      position:relative;
      flex:none;
    }

    .brand-mark:after{
      content:"";
      position:absolute;
      inset:9px;
      border:1px solid rgba(255,255,255,.8);
      border-radius:50%;
    }

    .brand small{
      display:block;
      font-size:11px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.08em;
    }

    .brand strong{font-size:18px}

    .navlinks{
      display:flex;
      gap:22px;
      font-weight:700;
      font-size:14px;
    }

    .navlinks a{
      padding:10px 0;
      position:relative;
    }

    .navlinks a:after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:5px;
      height:2px;
      background:var(--active);
      transform:scaleX(0);
      transform-origin:left;
      transition:.2s;
    }

    .navlinks a:hover,
    .navlinks a.active{
      color:var(--active);
    }

    .navlinks a:hover:after,
    .navlinks a.active:after{
      transform:scaleX(1);
    }

    .navlinks a.active:after{height:3px}

    .nav-cta{
      background:var(--navy);
      color:#fff;
      border-radius:999px;
      padding:11px 18px;
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
    }

    /* =====================
       HERO
    ===================== */

    .hero{
      background:linear-gradient(
        135deg,
        #faf8f2 0%,
        #f5f1e8 46%,
        #eee8dc 100%
      );
      min-height:760px;
      display:flex;
      align-items:center;
      overflow:hidden;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:64px;
      align-items:center;
      padding:90px 0;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--navy);
      font-weight:900;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .eyebrow:before{
      content:"";
      width:34px;
      height:2px;
      background:var(--sage);
    }

    h1{
      margin:18px 0 22px;
      font-size:clamp(48px,7vw,84px);
      line-height:1.04;
      letter-spacing:-.055em;
      white-space:pre-line;
    }

    .hero p{
      font-size:20px;
      color:#4d5560;
      max-width:650px;
      margin:0 0 34px;
      white-space:pre-line;
    }

    .hero-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:54px;
      padding:0 24px;
      border-radius:12px;
      font-weight:900;
      border:1px solid transparent;
      cursor:pointer;
      transition:.25s ease;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(31,36,48,.16);
    }

    .btn.primary{
      background:var(--navy);
      color:#fff;
    }

    .btn.secondary{
      border-color:var(--navy);
      color:var(--navy);
      background:rgba(255,255,255,.45);
    }

    .hero-panel{
      border-radius:34px;
      background:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.9);
      box-shadow:var(--shadow);
      padding:34px;
    }

    .hero-panel .label{
      font-size:13px;
      font-weight:900;
      color:var(--blue);
      letter-spacing:.08em;
    }

    .hero-panel h2{
      font-size:32px;
      line-height:1.25;
      margin:10px 0 24px;
    }

    /* D-DAY */

    .deadline-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:0 16px;
      border-radius:999px;
      background:var(--navy);
      color:#fff;
      font-size:14px;
      font-weight:900;
      margin-bottom:18px;
    }

    .deadline-badge.closed{
      background:#737a82;
    }

    .hero-facts{display:grid}

    .fact{
      display:grid;
      grid-template-columns:112px 1fr;
      gap:12px;
      padding:15px 0;
      border-top:1px solid rgba(31,36,48,.1);
    }

    .fact b{color:var(--navy)}

    .tiny{
      font-size:13px;
      color:var(--muted);
      margin-top:20px;
    }

    /* =====================
       COMMON
    ===================== */

    section{padding:106px 0}

    .soft{
      background:linear-gradient(
        145deg,
        #faf8f3 0%,
        #f5f1e8 52%,
        #eee9df 100%
      );
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:30px;
      margin-bottom:44px;
    }

    .section-head h2{
      font-size:clamp(34px,5vw,54px);
      line-height:1.1;
      margin:8px 0 0;
      letter-spacing:-.04em;
    }

    .section-head p{
      max-width:540px;
      color:var(--muted);
      font-size:18px;
      margin:0;
    }

    .intro-grid{
      display:grid;
      grid-template-columns:.85fr 1.15fr;
      gap:60px;
    }

    .quote{
      font-size:34px;
      line-height:1.35;
      font-weight:800;
      color:var(--navy);
      white-space:pre-line;
    }

    .bodycopy{
      font-size:18px;
      color:#4f5660;
    }

    /* =====================
       FEATURES
    ===================== */

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .card{
      background:#fff;
      border:1px solid rgba(31,36,48,.08);
      border-radius:24px;
      padding:30px;
      box-shadow:0 10px 28px rgba(31,36,48,.05);
    }

    .num{
      font-size:13px;
      font-weight:900;
      color:var(--sage);
      letter-spacing:.12em;
    }

    .card h3{
      font-size:23px;
      margin:12px 0;
    }

    .card p{
      margin:0;
      color:var(--muted);
    }

    /* =====================
       CURRICULUM
    ===================== */

    .curriculum{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
      counter-reset:item;
    }

    .course{
      counter-increment:item;
      display:grid;
      grid-template-columns:64px 1fr;
      gap:20px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
    }

    .course:before{
      content:counter(item,decimal-leading-zero);
      width:52px;
      height:52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--navy);
      color:#fff;
      font-weight:900;
    }

    .course h3{
      margin:0 0 6px;
      font-size:21px;
    }

    .course p{
      margin:0;
      color:var(--muted);
    }
/* =====================
   HOVER MOTION
===================== */

.card,
.course,
.benefit{
  transition:
    transform .28s ease,
    box-shadow .28s ease,
    border-color .28s ease;
}

.card:hover,
.course:hover,
.benefit:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(31,36,48,.10);
}

.course::before,
.benefit-icon{
  transition:
    transform .32s cubic-bezier(.22,.61,.36,1),
    background .28s ease;
}

.course:hover::before,
.benefit:hover .benefit-icon{
  transform:translateY(-3px) scale(1.08) rotate(-4deg);
}

.card:hover .num{
  transform:translateX(5px);
}

.num{
  display:inline-block;
  transition:transform .3s ease;
}


/* =====================
   BENEFITS
===================== */
    
  
  }

  /* =====================
       BENEFITS
    ===================== */

    .benefit-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:14px;
    }

    .benefit{
      background:#fff;
      border:1px solid rgba(31,36,48,.08);
      border-radius:22px;
      padding:26px 22px;
      min-height:220px;
      box-shadow:0 10px 28px rgba(31,36,48,.04);
      transition:.3s ease;
    }

    .benefit:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 40px rgba(31,36,48,.1);
    }

    .benefit-icon{
      width:46px;
      height:46px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--navy);
      color:#fff;
      font-weight:900;
      margin-bottom:20px;
    }

    .benefit h3{
      font-size:19px;
      margin:0 0 10px;
      line-height:1.35;
    }

    .benefit p{
      font-size:15px;
      color:var(--muted);
      margin:0;
    }

    /* =====================
       FACULTY
    ===================== */

    .faculty-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:24px;
    }

    .faculty{
      display:grid;
      grid-template-columns:220px minmax(0,1fr);
      gap:36px;
      align-items:center;
      padding:28px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
    }

    .faculty-photo{
      position:relative;
      width:220px;
      aspect-ratio:4/5;
      overflow:hidden;
      border-radius:18px;
      background:#eef0f2;
    }

    .faculty-slide{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      visibility:hidden;
      transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
    }

    .faculty-slide.active{
      opacity:1;
      visibility:visible;
    }

    /* 사진 슬라이드 도트 */

    .faculty-dots{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      z-index:5;
      display:flex;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(20,25,32,.32);
      backdrop-filter:blur(5px);
    }

    .faculty-dot{
      width:7px;
      height:7px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.48);
      cursor:pointer;
      transition:.25s;
    }

    .faculty-dot.active{
      width:18px;
      border-radius:999px;
      background:#fff;
    }

    .faculty-info h3{
      margin:0 0 6px;
      font-size:28px;
      color:var(--navy);
    }

    .faculty-role{
      margin:0 0 18px;
      color:var(--blue);
      font-size:16px;
      font-weight:800;
    }

    .faculty-career{
      margin:0;
      padding-left:20px;
      color:var(--muted);
    }

    .faculty-career li{
      margin:5px 0;
    }

    /* =====================
       RECRUITMENT
    ===================== */

    .recruit-wrap{
      display:grid;
      grid-template-columns:1.18fr .82fr;
      gap:28px;
      align-items:start;
    }

    .recruit-table{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .recruit-row{
      display:grid;
      grid-template-columns:160px 1fr;
      border-bottom:1px solid var(--line);
    }

    .recruit-row:last-child{border-bottom:none}

    .recruit-row b{
      padding:20px 22px;
      background:#f3f0e9;
      color:var(--navy);
    }

    .recruit-row span{
      padding:20px 22px;
    }

    .price-box{
      background:var(--navy);
      color:#fff;
      border-radius:24px;
      padding:32px;
      position:sticky;
      top:104px;
    }

    .price-box .small{
      font-size:13px;
      font-weight:900;
      color:#c9d2dc;
    }

    .price-box h3{
      font-size:25px;
      margin:8px 0 24px;
    }

    .price-old{
      font-size:18px;
      color:#bac3cc;
      text-decoration:line-through;
    }

    .price-arrow{
      color:#cbd2d9;
      margin:3px 0;
    }

    .price-new{
      font-size:42px;
      font-weight:900;
    }

    .price-note{
      font-size:14px;
      color:#cdd5dd;
      margin:8px 0 24px;
    }

    .recruit-notes{
      padding:20px 0 0;
      margin:0;
      list-style:none;
      color:var(--muted);
      font-size:14px;
    }

    /* =====================
       TIMELINE
    ===================== */

    .timeline-wrap{
      margin-top:58px;
    }

    .timeline-title{
      font-size:28px;
      margin:0 0 28px;
      color:var(--navy);
    }

    .audition-timeline{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      position:relative;
      gap:18px;
    }

    .audition-timeline:before{
      content:"";
      position:absolute;
      left:9%;
      right:9%;
      top:25px;
      height:2px;
      background:#d5d8dc;
      z-index:0;
    }

    .timeline-item{
      position:relative;
      z-index:1;
      text-align:center;
    }

    .timeline-number{
      width:52px;
      height:52px;
      margin:0 auto 16px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--navy);
      color:#fff;
      font-weight:900;
      box-shadow:0 7px 20px rgba(39,58,82,.18);
    }

    .timeline-item h3{
      margin:0 0 5px;
      font-size:18px;
    }

    .timeline-item p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    /* =====================
       APPLICATION
    ===================== */

    .apply-box{
      background:linear-gradient(135deg,var(--navy),#334f6e);
      color:#fff;
      border-radius:30px;
      padding:48px;
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:36px;
      align-items:center;
    }

    .apply-box h2{
      font-size:40px;
      line-height:1.2;
      margin:0 0 12px;
    }

    .apply-box p{
      color:rgba(255,255,255,.8);
      font-size:17px;
      margin:0;
    }

    .privacy{
      font-size:13px!important;
      margin-top:18px!important;
      color:#cbd3dc!important;
    }

    .apply-action{
      display:flex;
      justify-content:flex-end;
    }

    .apply-action .btn{
      background:#fff;
      color:var(--navy);
      min-width:220px;
    }

    /* =====================
       CONTACT
    ===================== */

    .contact-sponsors-bg{
      background:linear-gradient(
        145deg,
        #faf8f3 0%,
        #f5f1e8 52%,
        #eee9df 100%
      );
    }

    #contact{
      padding-bottom:36px;
      background:transparent;
    }

    #contact.soft{
      background:transparent;
    }

    .contact-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }

    .contact-card{
      padding:30px;
      border-top:3px solid var(--sage);
      background:#fff;
      box-shadow:var(--shadow);
    }

    .contact-card h3{
      margin:0 0 16px;
      font-size:22px;
    }

    .contact-card p{
      margin:8px 0;
      color:var(--muted);
    }

    .contact-card a{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    /* =====================
       SPONSORS
    ===================== */

    .sponsors{
      padding:48px 0 84px;
    }

    .sponsor-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }

    .sponsor{
      min-height:130px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:#C5D0D9;
      transition:.2s;
    }

    .sponsor:hover{
      transform:translateY(-3px);
      background:#B5C3CE;
    }

    .sponsor img{
      max-width:100%;
      max-height:70px;
      object-fit:contain;
    }

    .sponsor span{
      color:#fff;
      font-weight:900;
      text-align:center;
    }

    /* =====================
   FOOTER
===================== */

    /* Sponsor marquee: continuous, pauses on hover */
    .sponsor-grid{
      display:block;
      overflow:hidden;
      position:relative;
    }
    .sponsor-track{
      display:flex;
      width:max-content;
      gap:18px;
      animation:sponsor-marquee var(--sponsor-duration, 44s) linear infinite;
      will-change:transform;
    }
    .sponsor-grid:hover .sponsor-track,
    .sponsor-grid:focus-within .sponsor-track{animation-play-state:paused}
    .sponsor-track .sponsor{
      flex:0 0 clamp(180px, 21vw, 260px);
      width:clamp(180px, 21vw, 260px);
    }
    @keyframes sponsor-marquee{
      from{transform:translateX(0)}
      to{transform:translateX(-50%)}
    }
    @media(max-width:700px){
      .sponsor-grid{display:block}
      .sponsor-track .sponsor{flex-basis:165px;width:165px}
    }
    @media(max-width:620px){
      .sponsor-grid{display:block}
    }
    @media(prefers-reduced-motion:reduce){
      .sponsor-track{animation:none;will-change:auto}
      .sponsor-grid{overflow-x:auto}
    }

  .footer-row{
    grid-template-columns:1fr;

  }

   link.addEventListener('click',e=>{if(window.matchMedia('(max-width:980px)').matches){e.preventDefault();const group=link.closest('.nav-group');const open=group.classList.toggle('is-open');link.setAttribute('aria-expanded',String(open));}});
 });
 nav.querySelectorAll('.nav-dropdown a,.navlinks>a').forEach(link=>link.addEventListener('click',()=>{nav.classList.remove('mobile-open');btn.setAttribute('aria-expanded','false')}));
})();
</script></body></html>

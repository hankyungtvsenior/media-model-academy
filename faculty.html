.main{padding:75px 0 110px;min-height:380px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.head h2{font-size:30px;letter-spacing:-.04em;margin:0}.head p{margin:0;color:var(--muted)}.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.album{display:block;text-align:left;border:1px solid #e5e0d7;border-radius:22px;overflow:hidden;background:white;box-shadow:0 10px 28px rgba(31,36,48,.05);padding:0;transition:transform .28s,box-shadow .28s;width:100%}.album:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(31,36,48,.12)}.cover{aspect-ratio:4/3;background:#dce3e8;position:relative;overflow:hidden;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.cover .fallback{color:var(--navy);font-size:15px;font-weight:800;text-align:center;padding:20px}.album-info{padding:22px 24px}.album-date{color:#557a9e;font-size:13px;font-weight:800}.album-info h3{margin:7px 0;font-size:22px}.album-info p{margin:0;color:var(--muted);font-size:14px}.album-bottom{margin-top:14px;font-size:13px;font-weight:800;color:var(--navy)}.back{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--navy);font-weight:800;padding:0 0 24px}.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.photo{aspect-ratio:4/5;border:0;border-radius:15px;background:#dce3e8;overflow:hidden;padding:0;position:relative}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.photo:hover img{transform:scale(1.05)}.photo .fallback{padding:20px;font-size:13px;color:var(--navy)}.empty{padding:48px 24px;background:#f5f1e8;border-radius:20px;color:var(--muted);text-align:center}.hidden{display:none!important}

@media(max-width:980px){.navlinks{display:none}.albums{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.nav{min-height:70px}.brand strong{font-size:14px}.brand small{font-size:9px}.brand-mark{width:32px;height:32px}.nav-cta{font-size:12px;padding:9px 12px}.hero{padding:62px 0}.albums{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.head{display:block}.head p{margin-top:8px}.footer-row{flex-direction:column;text-align:center}.footer-contact{text-align:center}.lightbox{padding:65px 12px}.lb-prev,.lb-next{top:auto;bottom:55px}.lb-prev{left:20px}.lb-next{right:20px}.lb-caption{padding-bottom:55px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

    .faculty-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:24px;
    }

    .faculty{
      display:grid;
      grid-template-columns:300px minmax(0,1fr);
      gap:36px;
      align-items:center;
      padding:28px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
    }

    .faculty-photo{
      position:relative;
      width:100%;
      max-width:300px;
      height:375px;
      overflow:hidden;
      border-radius:18px;
      background:#e9edf0;
    }

    .faculty-slide{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
      opacity:0;
      visibility:hidden;
      transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
    }

    .faculty-slide.active{
      opacity:1;
      visibility:visible;
    }

    /* 사진 슬라이드 도트 */

    .faculty-dots{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      z-index:5;
      display:flex;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(20,25,32,.32);
      backdrop-filter:blur(5px);
    }

    .faculty-dot{
      width:7px;
      height:7px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.48);
      cursor:pointer;
      transition:.25s;
    }

    .faculty-dot.active{
      width:18px;
      border-radius:999px;
      background:#fff;
    }

    .faculty-info h3{
      margin:0 0 6px;
      font-size:28px;
      color:var(--navy);
    }

    .faculty-role{
      margin:0 0 18px;
      color:var(--blue);
      font-size:16px;
      font-weight:800;
    }

    .faculty-career{
      margin:0;
      padding-left:20px;
      color:var(--muted);
    }

    .faculty-career li{
      margin:5px 0;
    }


@media(max-width:700px){.faculty{grid-template-columns:1fr;padding:20px;gap:22px}.faculty-photo{width:100%;max-width:300px;height:375px;margin:auto}.curriculum{grid-template-columns:1fr}}

/* Shared dropdown navigation */
.navlinks{align-items:center;gap:20px}
.navlinks .nav-group{position:relative;display:flex;align-items:center}
.navlinks .nav-parent{display:flex;align-items:center;gap:6px;white-space:nowrap}
.navlinks .nav-parent::after{display:none}
.navlinks .nav-parent .nav-chevron{font-size:10px;transition:transform .2s}
.navlinks .nav-group:hover .nav-chevron,.navlinks .nav-group:focus-within .nav-chevron{transform:rotate(180deg)}
.navlinks .nav-dropdown{position:absolute;top:100%;left:0;min-width:178px;padding:9px;background:#fff;border:1px solid #e6e3dc;border-radius:12px;box-shadow:0 12px 30px rgba(17,33,54,.13);display:flex;flex-direction:column;gap:2px;opacity:0;visibility:hidden;transform:translateY(7px);transition:opacity .2s,transform .2s,visibility .2s;z-index:100}
.navlinks .nav-group:hover .nav-dropdown,.navlinks .nav-group:focus-within .nav-dropdown,.navlinks .nav-group.is-open .nav-dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.navlinks .nav-dropdown a{display:block;padding:12px 14px;border-radius:7px;white-space:nowrap;color:#273a52;text-decoration:none}
.navlinks .nav-dropdown a::after{display:none}
.navlinks .nav-dropdown a:hover,.navlinks .nav-dropdown a.active{background:#edf1f4;color:#294e76}
.mobile-nav-toggle{display:none;border:1px solid #dce1e5;background:#fff;border-radius:9px;padding:9px 12px;color:#273a52;font-weight:800;cursor:pointer}
@media(max-width:980px){
  .mobile-nav-toggle{display:block;order:3}
  .topbar .nav{position:relative}
  .topbar .navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;box-shadow:0 15px 28px rgba(0,0,0,.13);padding:14px 18px;z-index:110;flex-direction:column;align-items:stretch;gap:4px;max-height:calc(100vh - 100px);overflow-y:auto}
  .topbar .navlinks.mobile-open{display:flex}
  .navlinks .nav-group{display:block}
  .navlinks .nav-parent{width:100%;justify-content:space-between;padding:13px 8px}
  .navlinks>a{padding:13px 8px}
  .navlinks .nav-dropdown{position:static;display:none;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;background:#f6f7f8;padding:3px 8px;margin:0 0 8px;min-width:0}
  .navlinks .nav-group.is-open .nav-dropdown{display:flex}
}

/* Wider, clearer main navigation */
.topbar .navlinks { flex: 1; justify-content: center; gap: 34px; font-size: 17px; }
.topbar .navlinks .nav-parent { gap: 8px; }
.topbar .navlinks .nav-dropdown { min-width: 190px; font-size: 15px; }
@media (max-width: 1100px) and (min-width: 981px) {
  .topbar .navlinks { gap: 19px; font-size: 15px; }
}
@media (max-width: 980px) {
  .topbar .navlinks { flex: none; justify-content: flex-start; gap: 4px; font-size: 16px; }
}

/* Shared header alignment with index (10): fixed ARS, sticky navigation. */
body { padding-top: 48px; }
.ars-bar { position:fixed; top:0; left:0; width:100%; height:48px; min-height:48px; z-index:100; box-sizing:border-box; }
.topbar { position:sticky; top:48px; z-index:50; }

'active',j===i))};dots.forEach((d,j)=>d.addEventListener('click',()=>show(j)));setInterval(()=>show((i+1)%imgs.length),6000)});</script><script>

 nav.querySelectorAll('.nav-group .nav-parent').forEach(link=>{

    .curriculum{
      display:grid;

    .course{
      counter-increment:item;
      display:grid;
      grid-template-columns:64px 1fr;
      gap:20px;
      padding:26px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
    }

      content:counter(item,decimal-leading-zero);
      width:52px;
      height:52px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--navy);
      color:#fff;
      font-weight:900;
    }

    .course h3{
      margin:0 0 6px;
      font-size:21px;
    }

    .course p{
      margin:0;
      color:var(--muted);
    }


.card,
.course,
.benefit{
  transition:
    transform .28s ease,
    box-shadow .28s ease,
    border-color .28s ease;
}

.card:hover,
.course:hover,
.benefit:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(31,36,48,.10);
}

.course::before,
.benefit-icon{
  transition:
    transform .32s cubic-bezier(.22,.61,.36,1),
    background .28s ease;
}

.course:hover::before,
.benefit:hover .benefit-icon{
  transform:translateY(-3px) scale(1.08) rotate(-4deg);
}

.card:hover .num{
  transform:translateX(5px);
}

.num{
  display:inline-block;
  transition:transform .3s ease;
}

name: 유튜브 영상 자동 갱신
on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다
  workflow_dispatch: {}      # 수동 실행 버튼
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_videos.py
      - name: 변경이 있으면 저장
        run: |
          if ! git diff --quiet; then
            git config user.name "video-bot"
            git config user.email "video-bot@users.noreply.github.com"
            git add video-content.js
            git commit -m "유튜브 새 영상 자동 반영"
            git push
          fi

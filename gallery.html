<style>
:root{--navy:#273a52;--ink:#1f2430;--muted:#68707a;--ivory:#f5f1e8;--line:#d7d2c8;--max:1180px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.7 "Noto Sans KR",sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
.ars-bar{min-height:48px;background:var(--navy);color:white;display:flex;justify-content:center;align-items:center;text-align:center;font-weight:800;padding:9px 15px;gap:9px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid #e6e3dc;backdrop-filter:blur(14px)}.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:78px}.brand{display:flex;gap:12px;align-items:center;font-weight:900}.brand-mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--navy),#8b9b8e);flex:none}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}.brand strong{font-size:18px}.navlinks{display:flex;align-items:center;gap:20px;font-size:14px;font-weight:700}.navlinks a:hover,.navlinks .active{color:#557a9e}.nav-cta{border-radius:999px;background:var(--navy);color:white;padding:11px 18px;font-weight:800;font-size:14px;white-space:nowrap}
.hero{background:linear-gradient(135deg,#faf8f2,#f5f1e8 55%,#eee8dc);padding:82px 0 76px}.eyebrow{font-size:14px;font-weight:900;letter-spacing:.12em;color:var(--navy)}h1{font-size:clamp(42px,6vw,68px);letter-spacing:-.055em;line-height:1.15;margin:12px 0 18px}.hero p{font-size:18px;color:#4d5560;margin:0}.crumb{margin-top:30px;font-size:14px;color:#697381}.crumb a{text-decoration:underline;text-underline-offset:3px}
.main{padding:75px 0 110px;min-height:380px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.head h2{font-size:30px;letter-spacing:-.04em;margin:0}.head p{margin:0;color:var(--muted)}.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.album{display:block;text-align:left;border:1px solid #e5e0d7;border-radius:22px;overflow:hidden;background:white;box-shadow:0 10px 28px rgba(31,36,48,.05);padding:0;transition:transform .28s,box-shadow .28s;width:100%}.album:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(31,36,48,.12)}.cover{aspect-ratio:4/3;background:#dce3e8;position:relative;overflow:hidden;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.cover .fallback{color:var(--navy);font-size:15px;font-weight:800;text-align:center;padding:20px}.album-info{padding:22px 24px}.album-date{color:#557a9e;font-size:13px;font-weight:800}.album-info h3{margin:7px 0;font-size:22px}.album-info p{margin:0;color:var(--muted);font-size:14px}.album-bottom{margin-top:14px;font-size:13px;font-weight:800;color:var(--navy)}.back{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--navy);font-weight:800;padding:0 0 24px}.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.photo{aspect-ratio:4/5;border:0;border-radius:15px;background:#dce3e8;overflow:hidden;padding:0;position:relative}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.photo:hover img{transform:scale(1.05)}.photo .fallback{padding:20px;font-size:13px;color:var(--navy)}.empty{padding:48px 24px;background:#f5f1e8;border-radius:20px;color:var(--muted);text-align:center}.hidden{display:none!important}
footer{background:#f8f6f0;border-top:1px solid #ded8ca;padding:32px 0;color:#344052}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:30px}.footer-logos{display:flex;align-items:center;gap:14px}.footer-logos img{max-width:150px;max-height:42px;object-fit:contain}.footer-logos span{color:#9a927f}.footer-center{text-align:center}.footer-center strong{font-size:14px}.footer-center p{margin:4px 0 0;color:#6f7781;font-size:13px}.footer-contact{text-align:right;font-size:14px}.footer-contact a{font-weight:800;color:var(--navy)}
.lightbox{position:fixed;inset:0;background:rgba(12,18,28,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:65px 60px 45px}.lightbox img{max-width:100%;max-height:calc(100vh - 155px);object-fit:contain}.lb-close,.lb-prev,.lb-next{position:absolute;border:0;background:rgba(255,255,255,.16);color:white;border-radius:50%;display:grid;place-items:center}.lb-close{top:16px;right:20px;width:44px;height:44px;font-size:26px}.lb-prev,.lb-next{top:50%;width:48px;height:48px;font-size:30px}.lb-prev{left:12px}.lb-next{right:12px}.lb-caption{color:white;margin-top:15px;text-align:center;font-size:14px}
@media(max-width:980px){.navlinks{display:none}.albums{grid-template-columns:repeat(2,1fr)}.photos{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.nav{min-height:70px}.brand strong{font-size:14px}.brand small{font-size:9px}.brand-mark{width:32px;height:32px}.nav-cta{font-size:12px;padding:9px 12px}.hero{padding:62px 0}.albums{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,1fr)}.head{display:block}.head p{margin-top:8px}.footer-row{flex-direction:column;text-align:center}.footer-contact{text-align:center}.lightbox{padding:65px 12px}.lb-prev,.lb-next{top:auto;bottom:55px}.lb-prev{left:20px}.lb-next{right:20px}.lb-caption{padding-bottom:55px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
<script src="gallery-content.js"></script>
</head>
<body>
<div class="ars-bar"><strong>ARS 결제 안내</strong><span>ARS 번호가 확정되면 이곳에 표시됩니다.</span></div>
<header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark"></span><span><small>K-SENIOR MEDIA MODEL ACADEMY</small><strong>K-시니어 미디어 모델 아카데미</strong></span></a><nav class="navlinks"><a href="index.html#academy">아카데미 소개</a><a href="curriculum.html">커리큘럼</a><a href="index.html#benefits">교육생 특전</a><a href="faculty.html">강사진</a><a href="gallery.html" class="active" aria-current="page">행사 갤러리</a><a href="index.html#contact">문의</a></nav><a class="nav-cta" href="index.html">메인으로 돌아가기</a></div></header>
<div class="hero"><div class="wrap"><div class="eyebrow">EVENT GALLERY</div><h1>행사 갤러리</h1><p>함께한 순간들을 사진으로 만나보세요.</p><div class="crumb"><a href="index.html">HOME</a> / 행사 갤러리</div></div></div>
<main class="main"><div class="wrap"><div id="listView"><div class="head"><h2>행사별 앨범</h2><p>행사를 선택하면 사진을 볼 수 있습니다.</p></div><div class="albums" id="albums"></div></div><div id="detailView" class="hidden"><button class="back" id="backBtn" type="button">← 전체 앨범으로</button><div class="head"><div><div class="eyebrow" id="albumDate"></div><h2 id="albumTitle"></h2></div><p id="albumDescription"></p></div><div class="photos" id="photos"></div></div></div></main>
<footer><div class="wrap footer-row"><div class="footer-logos"><a href="https://www.wowtv.co.kr/" target="_blank" rel="noopener"><img src="assets/sponsors/hankyungtv.png" alt="한국경제TV"></a><span>×</span><a href="https://www.sfma.kr/" target="_blank" rel="noopener"><img src="assets/sponsors/sfma.png" alt="시니어패션모델협회"></a></div><div class="footer-center"><strong>K-시니어 미디어 모델 아카데미</strong><p>여러분의 새로운 도전과 멋진 시작을 응원합니다.</p></div><div class="footer-contact"><a href="tel:02-6676-0448">02-6676-0448</a> · <a href="tel:010-4214-7787">010-4214-7787</a></div></div></footer>
<div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기"><button type="button" class="lb-close" id="lbClose" aria-label="닫기">×</button><button type="button" class="lb-prev" id="lbPrev" aria-label="이전 사진">‹</button><img id="lbImage" alt=""><button type="button" class="lb-next" id="lbNext" aria-label="다음 사진">›</button><div class="lb-caption" id="lbCaption"></div></div>
<script>
(()=>{
 const albums=typeof GALLERY_ALBUMS!=='undefined'?GALLERY_ALBUMS:[];
 const $=id=>document.getElementById(id);
 const create=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
 function imageOrFallback(src,alt,container){const img=create('img');img.alt=alt;img.loading='lazy';img.src=src;img.onerror=()=>{img.remove();container.append(create('div','fallback','사진 준비 중'))};container.append(img)}
 function showList(){history.replaceState(null,'',location.pathname);$('listView').classList.remove('hidden');$('detailView').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
 function openAlbum(album){history.replaceState(null,'','#'+encodeURIComponent(album.id));$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');$('albumDate').textContent=album.date||'';$('albumTitle').textContent=album.title;$('albumDescription').textContent=album.description||'';const grid=$('photos');grid.replaceChildren();if(!album.photos?.length){grid.append(create('div','empty','사진이 등록되면 이곳에 표시됩니다.'))}else album.photos.forEach((src,i)=>{const b=create('button','photo');b.type='button';b.setAttribute('aria-label',`${i+1}번 사진 확대`);imageOrFallback(src,`${album.title} ${i+1}번 사진`,b);b.onclick=()=>openLightbox(album,i);grid.append(b)});window.scrollTo({top:0,behavior:'smooth'})}
 const list=$('albums');if(!albums.length)list.append(create('div','empty','등록된 행사 앨범이 없습니다.'));
 albums.forEach(album=>{const b=create('button','album');b.type='button';const cover=create('div','cover');if(album.photos?.length)imageOrFallback(album.photos[0],album.title,cover);else cover.append(create('div','fallback','사진 준비 중'));b.append(cover);const info=create('div','album-info');info.append(create('div','album-date',album.date||''),create('h3','',album.title),create('p','',album.description||''),create('div','album-bottom',`${album.photos?.length||0}장 · 앨범 보기 →`));b.append(info);b.onclick=()=>openAlbum(album);list.append(b)});
 $('backBtn').onclick=showList;
 let currentAlbum=null,currentIndex=0,lastFocus=null;
 function openLightbox(album,i){currentAlbum=album;currentIndex=i;lastFocus=document.activeElement;$('lightbox').classList.remove('hidden');document.body.style.overflow='hidden';showPhoto();$('lbClose').focus()}
 function showPhoto(){const src=currentAlbum.photos[currentIndex];$('lbImage').src=src;$('lbImage').alt=`${currentAlbum.title} ${currentIndex+1}번 사진`;$('lbCaption').textContent=`${currentAlbum.title} · ${currentIndex+1} / ${currentAlbum.photos.length}`}
 function step(n){if(!currentAlbum)return;currentIndex=(currentIndex+n+currentAlbum.photos.length)%currentAlbum.photos.length;showPhoto()}
 function close(){if($('lightbox').classList.contains('hidden'))return;$('lightbox').classList.add('hidden');document.body.style.overflow='';currentAlbum=null;lastFocus?.focus()}
 $('lbClose').onclick=close;$('lbPrev').onclick=()=>step(-1);$('lbNext').onclick=()=>step(1);$('lightbox').onclick=e=>{if(e.target===$('lightbox'))close()};document.addEventListener('keydown',e=>{if($('lightbox').classList.contains('hidden'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
 const hash=decodeURIComponent(location.hash.slice(1));const selected=albums.find(a=>a.id===hash);if(selected)openAlbum(selected);
})();
</script>
